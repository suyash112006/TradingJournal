<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password - TradeJournal</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>

<body class="auth-layout">

    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
        <source src="{{ url_for('static', filename='videos/hover_events_remix.webm') }}" type="video/webm">
    </video>

    <div class="auth-wrapper">
        <div class="auth-card animate-auth">
            <h1 class="brand-title">Trade<span class="text-success">Journal</span></h1>
            <p class="text-muted" style="text-align: center; margin-bottom: 24px;">Reset your password</p>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <p style="color:red;margin-bottom:12px;text-align: center;">{{ messages[0] }}</p>
            {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                <button type="submit" class="btn btn-primary w-100" style="margin-top: 12px;">Send Reset Link</button>
            </form>

            <p style="text-align: center;">
                Suddenly remembered? <a href="{{ url_for('index') }}" class="text-success">Login</a>
            </p>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>

</body>

</html>
