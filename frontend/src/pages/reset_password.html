<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password - TradeJournal</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>

<body class="auth-layout">

    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
        <source src="{{ url_for('static', filename='videos/hover_events_remix.webm') }}" type="video/webm">
    </video>

    <div class="auth-wrapper">
        <div class="auth-card animate-auth">
            <h1 class="brand-title">Trade<span class="text-success">Journal</span></h1>
            <p class="text-muted" style="text-align: center; margin-bottom: 24px;">Enter new password</p>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <p style="color:red;margin-bottom:12px;text-align: center;">{{ messages[0] }}</p>
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="password-wrapper">
                    <input type="password" name="password" id="password" class="form-control" placeholder="New Password"
                        required>
                    <span class="toggle-password" onclick="togglePassword('password', this)">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </span>
                </div>
                <div class="password-wrapper">
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control"
                        placeholder="Confirm New Password" required>
                    <span class="toggle-password" onclick="togglePassword('confirm_password', this)">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </span>
                </div>
                <button type="submit" class="btn btn-primary w-100" style="margin-top: 12px;">Update Password</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
        function togglePassword(inputId, el) {
            const input = document.getElementById(inputId);
            const icon = el.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>

</body>

</html>
